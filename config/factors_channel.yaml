#MA250_SLOPE_2_LAG5:  "(Ref(Mean($close, 250), 5)  - Ref(Mean($close, 250), 6))/ (Ref(Mean($close, 250), 5) + 1e-12)"
#MA250_SLOPE_2_LAG10: "(Ref(Mean($close, 250), 10)  - Ref(Mean($close, 250), 11))/ (Ref(Mean($close, 250), 10) + 1e-12)"

#MA500_SLOPE_2:       "(Mean($close, 500) - Ref(Mean($close, 500), 1)) / (Mean($close, 500) + 1e-12)"
