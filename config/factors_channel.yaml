# 1. 均线方向（有方向：标准化单日均线导数，正值上行，负值下行）
MA20_SLOPE_2:       "(Mean($close, 20) - Ref(Mean($close, 20), 1)) / (Mean($close, 20) + 1e-12)"
MA20_SLOPE_2_LAG5:  "(Ref(Mean($close, 20), 5)  - Ref(Mean($close, 20), 6))/ (Ref(Mean($close, 20), 5) + 1e-12)"
MA20_SLOPE_2_LAG10: "(Ref(Mean($close, 20), 10)  - Ref(Mean($close, 20), 11))/ (Ref(Mean($close, 20), 10) + 1e-12)"

MA60_SLOPE_2:       "(Mean($close, 60) - Ref(Mean($close, 60), 1)) / (Mean($close, 60) + 1e-12)"
MA60_SLOPE_2_LAG5:  "(Ref(Mean($close, 60), 5)  - Ref(Mean($close, 60), 6))/ (Ref(Mean($close, 60), 5) + 1e-12)"
MA60_SLOPE_2_LAG10: "(Ref(Mean($close, 60), 10)  - Ref(Mean($close, 60), 11))/ (Ref(Mean($close, 60), 10) + 1e-12)"


MA5_MA20_DIFF:  "(Mean($close, 5) - Mean($close, 20)) / (Mean($close, 20) + 1e-12)"
MA20_MA60_DIFF: "(Mean($close, 20) - Mean($close, 60)) / (Mean($close, 60) + 1e-12)"


MA5_MA20_DIFF_LAG5:  "(Ref(Mean($close, 5), 5) - Ref(Mean($close, 20), 5)) / (Ref(Mean($close, 20), 5) + 1e-12)"
MA20_MA60_DIFF_LAG5: "(Ref(Mean($close, 20), 5) - Ref(Mean($close, 60), 5)) / (Ref(Mean($close, 60), 5) + 1e-12)"


