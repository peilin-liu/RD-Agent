#BETA500: "Slope($close, 500)/$close"

# 2. 均线波动效率（路径效率越接近 1，均线越单向平滑；越接近 0，来回震荡越多）
#MA10_VOL_EFF_10: "Abs(Sum(Delta(Mean($close, 10), 1), 10)) / (Sum(Abs(Delta(Mean($close, 10), 1)), 10) + 1e-12)"
